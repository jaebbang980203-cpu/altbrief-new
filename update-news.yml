name: Update and Deploy AltBrief

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "sw.js"
      - "manifest.webmanifest"
      - "update_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: altbrief-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public RSS news
        run: python update_news.py

      - name: Commit updated news.json
        shell: bash
        run: |
          git config user.name "altbrief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update AltBrief news [skip ci]"
            git push
          else
            echo "No news.json changes to commit."
          fi

      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html app.js styles.css sw.js manifest.webmanifest news.json dist/
          cp icon-192.png icon-512.png dist/
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
